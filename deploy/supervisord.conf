; TrueGlow 映真 —— 容器内同时托管后端与前端
; 后端仅监听 127.0.0.1（不对外），对外只有 Streamlit 的 7860。
;
; 注意：不要在此设置 [supervisord] user=root。某些平台（如 Hugging Face Spaces）
; 会以非 root 用户运行容器，届时 supervisord 会因 "Can't drop privilege as nonroot user"
; 直接退出，整个服务无法启动。保持默认即以当前用户运行，root 与非 root 都可用。
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:api]
command=python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000
directory=/app
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ui]
command=python -m streamlit run app.py --server.address 0.0.0.0 --server.port 7860 --server.headless true --browser.gatherUsageStats false
directory=/app
environment=BEAUTYPROOF_API_BASE_URL="http://127.0.0.1:8000"
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
