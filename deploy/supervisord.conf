; TrueGlow 映真 —— 容器内同时托管后端与前端
; 后端仅监听 127.0.0.1（不对外暴露），对外只有 Streamlit 的 7860。
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:api]
command=python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000
directory=/app
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ui]
command=python -m streamlit run app.py --server.address 0.0.0.0 --server.port 7860 --server.headless true --browser.gatherUsageStats false
directory=/app
environment=BEAUTYPROOF_API_BASE_URL="http://127.0.0.1:8000"
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
